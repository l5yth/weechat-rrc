[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weechat-rrc"
version = "0.1.0"
description = "WeeChat plugin for Reticulum Relay Chat (RRC)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "l5yth & contributors" }]
keywords = ["weechat", "reticulum", "rns", "rrc", "chat", "cbor"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Topic :: Communications :: Chat",
]
dependencies = ["rns>=1.5.2", "cbor2>=5.6"]

[project.optional-dependencies]
test = ["pytest>=8", "coverage>=7", "black>=24"]

[project.scripts]
rrc-helper = "rrc_helper.__main__:main"

[tool.setuptools]
packages = ["rrc_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["rrc", "rrc_helper"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
